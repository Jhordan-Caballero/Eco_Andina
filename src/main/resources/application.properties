spring.application.name=Eco_Andino



# Carga opcional de un archivo .env local (ignorado por git); ver .env.example
spring.config.import=optional:file:.env[.properties]

# Configuración de PostgreSQL (variables de entorno o .env)

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_residuos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Abc1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Muestra las consultas en consola
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Le da formato legible (multilínea) a las consultas en consola
spring.jpa.properties.hibernate.format_sql=true 

# Evita ambigüedades sobre cómo generar el SQL para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actualiza las tablas según tus entidades
spring.jpa.hibernate.ddl-auto=update

server.port=8082
server.forward-headers-strategy=native

# JWT: si JWT_SECRET está vacío se genera una clave temporal al iniciar
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.jwt.issuer=ecoandina

# Orígenes permitidos por CORS (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Datos iniciales: permisos, roles y usuarios de prueba
app.seed.enabled=${SEED_ENABLED:true}
app.seed.default-password=${SEED_DEFAULT_PASSWORD:EcoAndina2026!}
# Bloqueo temporal tras intentos fallidos de inicio de sesión (contra fuerza bruta)
app.security.login.max-attempts=5
app.security.login.lock-minutes=15

# Archivos adjuntos (CU16): carpeta en disco y tamaño máximo (10 MB)
app.uploads.dir=${UPLOADS_DIR:uploads}
app.uploads.max-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Hora oficial de la planta (fechas de registros, plazos y vigencias)
app.timezone=America/Lima

# ---------------------------------------------------------------- Monitoreo (docs/plan-monitoreo.md)
# Endpoints de Actuator: health e info son públicos (solo estado UP/DOWN); el resto exige rol ADMINISTRADOR
management.endpoints.web.exposure.include=health,info,metrics,loggers,scheduledtasks
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMINISTRADOR
# Sondas liveness/readiness en /actuator/health/liveness y /actuator/health/readiness
management.endpoint.health.probes.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
# Petición que tarde más que esto (ms) queda como PETICION_LENTA en logs/ecoandina-alertas.log
app.monitoreo.peticion-lenta-ms=${PETICION_LENTA_MS:1000}
# Espacio libre mínimo en el disco de adjuntos; por debajo, /actuator/health pasa a DOWN
app.monitoreo.espacio-minimo-mb=${ESPACIO_MINIMO_MB:500}

# ---------------------------------------------------------------- Mantenimiento (docs/plan-mantenimiento.md)
# Tareas programadas (cron de Spring: segundo minuto hora día mes día-semana), en hora de Lima
app.mantenimiento.habilitado=${MANTENIMIENTO_HABILITADO:true}
# Depuración de auditoría según la retención configurada en CU22: todos los días a las 02:00
app.mantenimiento.depuracion-auditoria-cron=0 0 2 * * *
# Verificación de archivos adjuntos (faltantes o huérfanos): domingos a las 03:00
app.mantenimiento.verificacion-archivos-cron=0 0 3 * * SUN
# Alerta de autorizaciones de transportistas y gestores por vencer: lunes a viernes a las 07:00
app.mantenimiento.vigencias-cron=0 0 7 * * MON-FRI

