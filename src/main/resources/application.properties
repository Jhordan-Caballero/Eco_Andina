spring.application.name=Eco_Andino



# Carga opcional de un archivo .env local (ignorado por git); ver .env.example
spring.config.import=optional:file:.env[.properties]

# Configuración de PostgreSQL (variables de entorno o .env)

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_residuos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Muestra las consultas en consola
spring.jpa.show-sql=true

# Le da formato legible (multilínea) a las consultas en consola
spring.jpa.properties.hibernate.format_sql=true 

# Evita ambigüedades sobre cómo generar el SQL para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actualiza las tablas según tus entidades
spring.jpa.hibernate.ddl-auto=update

server.port=8082

# JWT: si JWT_SECRET está vacío se genera una clave temporal al iniciar
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.jwt.issuer=ecoandina

# Orígenes permitidos por CORS (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Datos iniciales: permisos, roles y usuarios de prueba
app.seed.enabled=${SEED_ENABLED:true}
app.seed.default-password=${SEED_DEFAULT_PASSWORD:EcoAndina2026!}