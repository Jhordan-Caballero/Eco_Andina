spring.application.name=Eco_Andino



# Configuración de PostgreSQL

spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_residuos
spring.datasource.username=postgres
spring.datasource.password=Abc1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Muestra las consultas en consola
spring.jpa.show-sql=true

# Le da formato legible (multilínea) a las consultas en consola
spring.jpa.properties.hibernate.format_sql=true 

# Evita ambigüedades sobre cómo generar el SQL para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actualiza las tablas según tus entidades
spring.jpa.hibernate.ddl-auto=update

server.port=8082