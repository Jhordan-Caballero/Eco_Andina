# Backend + frontend + base de datos. Solo el frontend se publica; la BD y el backend
# quedan en la red interna de Docker. Las variables obligatorias se definen en el
# entorno del despliegue (Dokploy) o en un .env junto a este archivo.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_residuos
      POSTGRES_USER: ecoandina
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoandina -d gestion_residuos"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/gestion_residuos
      DB_USERNAME: ecoandina
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET con al menos 32 caracteres}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:?Define SEED_DEFAULT_PASSWORD}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
