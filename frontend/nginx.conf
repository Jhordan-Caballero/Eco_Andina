server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # DNS interno de Docker: nginx arranca aunque el backend todavía no esté listo
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: se reenvía al servicio "backend" del docker-compose
    location /api/ {
        set $backend http://backend:8082;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre: se pueden cachear sin límite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # SPA: cualquier ruta del cliente devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
